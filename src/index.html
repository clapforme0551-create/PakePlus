<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bluesun 全球项目 · 按钮循环缩放</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0e1a;
            color: #f0f4ff;
            font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ===== 开场动画 ===== */
        #intro-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: #05080f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.8s ease, transform 1.8s ease;
            overflow: hidden;
        }
        #intro-container.fade-out {
            opacity: 0;
            transform: scale(0.92);
            pointer-events: none;
        }
        #intro-container.hidden {
            display: none;
        }

        #stars-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        #earth-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            z-index: 2;
            margin-bottom: 20px;
            animation: floatEarth 6s ease-in-out infinite alternate;
        }
        @keyframes floatEarth {
            0% {
                transform: translateY(0px) scale(1);
            }
            100% {
                transform: translateY(-16px) scale(1.02);
            }
        }
        #earth {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #4a8fc0, #1a3a5a);
            box-shadow: 0 0 80px rgba(60, 160, 220, 0.25), 0 0 160px rgba(60, 160, 220, 0.06);
            position: relative;
            overflow: hidden;
            animation: spinEarth 20s linear infinite;
        }
        #earth::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 40%, rgba(80, 180, 100, 0.25) 0%, transparent 30%),
                radial-gradient(circle at 70% 60%, rgba(60, 140, 80, 0.20) 0%, transparent 35%),
                radial-gradient(circle at 45% 20%, rgba(100, 200, 120, 0.15) 0%, transparent 25%),
                radial-gradient(circle at 10% 80%, rgba(40, 120, 60, 0.15) 0%, transparent 20%),
                radial-gradient(circle at 85% 30%, rgba(70, 180, 90, 0.18) 0%, transparent 28%),
                radial-gradient(circle at 55% 75%, rgba(50, 160, 80, 0.12) 0%, transparent 22%),
                repeating-linear-gradient(45deg,
                    rgba(100, 200, 255, 0.02) 0px,
                    rgba(100, 200, 255, 0.02) 2px,
                    transparent 2px,
                    transparent 8px);
            border-radius: 50%;
            animation: spinEarth 20s linear infinite;
            transform-origin: center center;
        }
        #earth::after {
            content: '';
            position: absolute;
            top: -12%;
            left: -12%;
            width: 124%;
            height: 124%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(100, 200, 255, 0.06), transparent 60%);
            box-shadow: inset 0 0 60px rgba(100, 200, 255, 0.03);
            pointer-events: none;
        }
        @keyframes spinEarth {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .glow-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(100, 200, 255, 0.04);
            animation: pulseRing 4s ease-in-out infinite;
        }
        .glow-ring.r1 {
            width: 320px;
            height: 320px;
            top: -30px;
            left: -30px;
            animation-delay: 0s;
        }
        .glow-ring.r2 {
            width: 380px;
            height: 380px;
            top: -60px;
            left: -60px;
            animation-delay: 1.2s;
        }
        .glow-ring.r3 {
            width: 440px;
            height: 440px;
            top: -90px;
            left: -90px;
            animation-delay: 2.4s;
        }
        @keyframes pulseRing {
            0% {
                opacity: 0.1;
                transform: scale(0.98);
            }
            50% {
                opacity: 0.3;
                transform: scale(1.02);
            }
            100% {
                opacity: 0.1;
                transform: scale(0.98);
            }
        }

        .intro-texts {
            position: relative;
            z-index: 3;
            text-align: center;
            margin-top: 10px;
        }
        .intro-texts .main-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #f9d976, #f5b342);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 60px rgba(249, 217, 118, 0.08);
        }
        .intro-texts .sub-title {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 3px;
            margin-top: 8px;
            color: #7ec8e3;
            text-shadow: 0 0 40px rgba(126, 200, 227, 0.06);
            -webkit-text-fill-color: #7ec8e3;
        }
        .intro-texts .sub-title em {
            font-style: normal;
            color: #a0d4f0;
            letter-spacing: 2px;
        }

        /* ---- 按钮：循环缩放引导 ---- */
        .intro-btn {
            position: relative;
            z-index: 3;
            margin-top: 30px;
            padding: 14px 44px;
            border: 1px solid rgba(100, 200, 255, 0.15);
            border-radius: 60px;
            background: rgba(100, 200, 255, 0.02);
            color: #b0d4f0;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 4px;
            cursor: pointer;
            transition: 0.4s ease;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 40px rgba(100, 200, 255, 0.02);
            font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif;
            /* 循环缩放动画：起始即播放 */
            animation: pulseScale 2.8s ease-in-out infinite;
        }
        /* hover 放大幅度增大 (与循环动画叠加) */
        .intro-btn:hover {
            background: rgba(100, 200, 255, 0.04);
            border-color: rgba(100, 200, 255, 0.25);
            box-shadow: 0 0 60px rgba(100, 200, 255, 0.02), inset 0 0 60px rgba(100, 200, 255, 0.01);
            transform: scale(1.12);
        }
        /* 点击时收缩 (反馈) */
        .intro-btn:active {
            transform: scale(0.92);
            animation: none;
        }

        /* 循环缩放关键帧：从1.0 → 1.08 → 1.0，带缓动 */
        @keyframes pulseScale {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.08);
            }
            100% {
                transform: scale(1);
            }
        }

        /* ===== 地图容器 ===== */
        #map-container {
            width: 100vw;
            height: 100vh;
            background: #0a0e1a;
            position: relative;
            display: none;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #0a0e1a;
        }
        #map-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #5a8aaa;
            font-size: 16px;
            z-index: 10;
            letter-spacing: 2px;
            text-align: center;
        }
        #map-loading .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(100, 200, 255, 0.1);
            border-top: 3px solid #7ec8e3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ===== 地图底图切换按钮 ===== */
        #map-layer-toggle {
            position: absolute;
            bottom: 120px;
            right: 20px;
            z-index: 1100;
            background: rgba(10, 14, 30, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(100, 200, 255, 0.06);
            border-radius: 12px;
            padding: 8px 10px;
            display: none;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }
        #map-layer-toggle button {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(100, 200, 255, 0.04);
            border-radius: 8px;
            color: #8ab4d6;
            padding: 6px 12px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            font-family: -apple-system, 'Segoe UI', sans-serif;
            letter-spacing: 0.3px;
        }
        #map-layer-toggle button:hover {
            background: rgba(100, 200, 255, 0.04);
            border-color: rgba(100, 200, 255, 0.08);
        }
        #map-layer-toggle button.active {
            background: rgba(100, 200, 255, 0.06);
            border-color: rgba(100, 200, 255, 0.12);
            color: #7ec8e3;
        }

        /* ===== 地图UI ===== */
        .corner-decor {
            position: absolute;
            z-index: 500;
            pointer-events: none;
            width: 40px;
            height: 40px;
            border-color: rgba(100, 200, 255, 0.10);
            border-style: solid;
            border-width: 0;
        }
        .corner-decor.tl {
            top: 12px;
            left: 12px;
            border-top-width: 2px;
            border-left-width: 2px;
        }
        .corner-decor.tr {
            top: 12px;
            right: 12px;
            border-top-width: 2px;
            border-right-width: 2px;
        }
        .corner-decor.bl {
            bottom: 12px;
            left: 12px;
            border-bottom-width: 2px;
            border-left-width: 2px;
        }
        .corner-decor.br {
            bottom: 12px;
            right: 12px;
            border-bottom-width: 2px;
            border-right-width: 2px;
        }

        .guide-box {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 14, 30, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(100, 200, 255, 0.06);
            border-radius: 12px;
            padding: 16px 22px;
            max-width: 300px;
            z-index: 1000;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            display: none;
        }
        .guide-box h2 {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #f9d976, #7ec8e3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .guide-box h2 strong {
            -webkit-text-fill-color: #f9d976;
        }
        .guide-box p {
            font-size: 13px;
            color: #8ab4d6;
            margin: 4px 0;
        }
        .guide-box .stat {
            display: inline-block;
            background: rgba(100, 200, 255, 0.04);
            padding: 3px 14px;
            border-radius: 30px;
            margin-top: 6px;
            color: #7ec8e3;
            font-size: 13px;
            border: 1px solid rgba(100, 200, 255, 0.04);
        }

        .lang-switch {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1100;
            background: rgba(10, 14, 30, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            border: 1px solid rgba(100, 200, 255, 0.06);
            padding: 4px 6px;
            display: none;
            gap: 2px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            max-width: 95%;
        }
        .lang-switch button {
            background: transparent;
            border: none;
            color: #6a8aaa;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.25s;
            font-weight: 400;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        .lang-switch button.active {
            background: rgba(100, 200, 255, 0.08);
            color: #7ec8e3;
            border: 1px solid rgba(100, 200, 255, 0.06);
        }
        .lang-switch button:hover:not(.active) {
            color: #b0d4f0;
        }

        .filter-panel {
            position: absolute;
            top: 82px;
            right: 16px;
            background: rgba(10, 14, 30, 0.75);
            backdrop-filter: blur(18px);
            border-radius: 16px;
            padding: 18px 20px 20px;
            z-index: 1000;
            border: 1px solid rgba(100, 200, 255, 0.04);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            max-width: 300px;
            width: 100%;
            max-height: calc(100vh - 170px);
            overflow-y: auto;
            pointer-events: auto;
            transition: 0.25s;
            display: none;
        }
        .filter-panel::-webkit-scrollbar {
            width: 3px;
        }
        .filter-panel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        .filter-panel::-webkit-scrollbar-thumb {
            background: #7ec8e3;
            border-radius: 10px;
        }
        .filter-panel .filter-title {
            font-size: 15px;
            font-weight: 400;
            color: #b0d4f0;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(100, 200, 255, 0.03);
            padding-bottom: 10px;
            letter-spacing: 1px;
        }
        .filter-panel .filter-title button {
            background: rgba(100, 200, 255, 0.04);
            border: 1px solid rgba(100, 200, 255, 0.04);
            border-radius: 30px;
            color: #7ec8e3;
            padding: 4px 14px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-panel .filter-title button:hover {
            background: rgba(100, 200, 255, 0.06);
        }
        .filter-group {
            margin-bottom: 14px;
        }
        .filter-group label {
            display: block;
            font-size: 11px;
            color: #5a7a9a;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
            font-weight: 300;
            text-transform: uppercase;
        }
        .filter-group select,
        .filter-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(100, 200, 255, 0.04);
            border-radius: 30px;
            color: #d0e4f0;
            padding: 7px 14px;
            font-size: 13px;
            outline: none;
            transition: 0.15s;
            appearance: auto;
        }
        .filter-group select option {
            background: #0a0e1a;
            color: #d0e4f0;
        }
        .filter-group select:focus,
        .filter-group input:focus {
            border-color: rgba(100, 200, 255, 0.10);
        }
        .filter-group input::placeholder {
            color: #3a5a7a;
            font-size: 12px;
        }
        .filter-row {
            display: flex;
            gap: 10px;
        }
        .filter-row .filter-group {
            flex: 1;
        }
        .filter-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .filter-actions button {
            flex: 1;
            background: rgba(100, 200, 255, 0.02);
            border: 1px solid rgba(100, 200, 255, 0.04);
            border-radius: 30px;
            color: #8ab4d6;
            padding: 8px 0;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 300;
            letter-spacing: 0.5px;
            min-width: 50px;
        }
        .filter-actions button:hover {
            background: rgba(100, 200, 255, 0.04);
        }
        .filter-actions .reset-btn {
            background: rgba(255, 255, 255, 0.02);
        }
        .filter-actions .export-btn {
            background: rgba(100, 200, 255, 0.03);
            border-color: rgba(100, 200, 255, 0.06);
            color: #7ec8e3;
        }
        .filter-actions .export-btn:hover {
            background: rgba(100, 200, 255, 0.06);
        }

        .custom-zoom {
            position: absolute;
            left: 20px;
            bottom: 120px;
            z-index: 1100;
            display: none;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
        }
        .custom-zoom button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(10, 14, 30, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 200, 255, 0.04);
            color: #7ec8e3;
            font-size: 20px;
            font-weight: 300;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .custom-zoom button:hover {
            background: rgba(100, 200, 255, 0.04);
        }

        .hot-projects {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            background: rgba(10, 14, 30, 0.7);
            backdrop-filter: blur(18px);
            border-radius: 16px;
            border: 1px solid rgba(100, 200, 255, 0.03);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            padding: 14px 18px;
            z-index: 1000;
            pointer-events: auto;
            overflow: hidden;
            display: none;
        }
        .hot-projects .hot-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: #7ec8e3;
            font-weight: 300;
            font-size: 14px;
            letter-spacing: 1px;
            padding: 0 4px;
        }
        .hot-projects .hot-title span {
            background: rgba(100, 200, 255, 0.03);
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 11px;
            color: #5a8aaa;
            border: 1px solid rgba(100, 200, 255, 0.03);
        }
        .hot-scroll-wrapper {
            position: relative;
            overflow: hidden;
            width: 100%;
        }
        .hot-scroll {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 6px 4px 12px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        .hot-scroll::-webkit-scrollbar {
            height: 3px;
        }
        .hot-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        .hot-scroll::-webkit-scrollbar-thumb {
            background: #7ec8e3;
            border-radius: 10px;
        }
        .hot-card {
            flex: 0 0 220px;
            min-width: 180px;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 12px;
            padding: 14px 16px;
            border-left: 2px solid rgba(100, 200, 255, 0.04);
            transition: 0.25s;
            cursor: pointer;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }
        .hot-card:hover {
            background: rgba(100, 200, 255, 0.02);
            transform: scale(1.02);
        }
        .hot-card .card-title {
            font-weight: 400;
            font-size: 14px;
            color: #d0e4f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.3px;
        }
        .hot-card .card-meta {
            font-size: 11px;
            color: #5a8aaa;
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
        }
        .hot-card .card-meta span {
            background: rgba(255, 255, 255, 0.02);
            padding: 0 8px;
            border-radius: 20px;
            border: 1px solid rgba(100, 200, 255, 0.02);
        }
        .hot-card .card-power {
            font-size: 13px;
            font-weight: 400;
            color: #7ec8e3;
            margin-top: 4px;
        }
        .hot-card .card-video-links {
            margin-top: 8px;
            font-size: 11px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .hot-card .card-video-links a {
            color: #5a8aaa;
            text-decoration: none;
            border-bottom: 1px dashed rgba(100, 200, 255, 0.04);
        }
        .hot-card .card-video-links a:hover {
            color: #7ec8e3;
        }
        .hot-card .card-video-links .no-link {
            color: #3a5a7a;
            font-size: 10px;
        }

        /* ===== Leaflet 自定义 ===== */
        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background: radial-gradient(circle at 30% 30%, #7ec8e3, #1a3a5a);
            border-radius: 50%;
            border: 2px solid rgba(100, 200, 255, 0.3);
            box-shadow: 0 0 30px rgba(100, 200, 255, 0.1);
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        .custom-marker.small {
            width: 34px;
            height: 34px;
            font-size: 12px;
        }
        .custom-marker.large {
            width: 54px;
            height: 54px;
            font-size: 20px;
        }

        .custom-info-window {
            background: rgba(10, 14, 30, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(100, 200, 255, 0.1);
            border-radius: 16px;
            padding: 16px 18px 18px;
            min-width: 240px;
            max-width: 380px;
            max-height: 400px;
            overflow-y: auto;
            color: #d0e4f0;
            box-shadow: 0 16px 60px rgba(0, 0, 0, 0.8);
        }
        .custom-info-window::-webkit-scrollbar {
            width: 3px;
        }
        .custom-info-window::-webkit-scrollbar-thumb {
            background: #7ec8e3;
            border-radius: 10px;
        }
        .custom-info-window .country-name {
            font-size: 20px;
            font-weight: 600;
            color: #7ec8e3;
            border-bottom: 1px solid rgba(100, 200, 255, 0.08);
            padding-bottom: 8px;
            margin-bottom: 10px;

        // 1. 开场动画
        // ================================================================
        (function() {
            var introContainer = document.getElementById('intro-container');
            var canvas = document.getElementById('stars-canvas');
            var ctx = canvas.getContext('2d');
            var w, h;

            function resizeCanvas() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            var stars = [];
            for (var i = 0; i < 400; i++) {
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    size: 0.3 + Math.random() * 1.8,
                    speed: 0.002 + Math.random() * 0.008,
                    layer: Math.random() > 0.6 ? 1 : 0
                });
            }
            var starFrame = 0;
            var animId = null;

            function drawStars() {
                ctx.clearRect(0, 0, w, h);
                var grad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w * 0.8);
                grad.addColorStop(0, '#0a1a2a');
                grad.addColorStop(0.6, '#050a12');
                grad.addColorStop(1, '#020408');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                for (var i = 0; i < stars.length; i++) {
                    var s = stars[i];
                    var offsetX = Math.sin(starFrame * s.speed + s.x) * 0.3;
                    var offsetY = Math.cos(starFrame * s.speed * 0.7 + s.y) * 0.3;
                    var x = s.x + offsetX;
                    var y = s.y + offsetY;
                    var size = s.size * (s.layer === 1 ? 1.4 : 0.8);
                    var alpha = 0.3 + Math.sin(starFrame * s.speed + s.x) * 0.1 + 0.3;

                    ctx.beginPath();
                    ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
                    var brightness = s.layer === 1 ? 220 : 160;
                    ctx.fillStyle = 'rgba(' + brightness + ', ' + (brightness + 20) + ', 255, ' + (alpha * 0.5) +
                        ')';
                    ctx.fill();

                    if (s.layer === 1 && size > 1.2) {
                        ctx.shadowColor = 'rgba(100, 200, 255, 0.01)';
                        ctx.shadowBlur = 30;
                        ctx.beginPath();
                        ctx.arc(x, y, size * 1.5, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(100, 200, 255, ' + (alpha * 0.02) + ')';
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                }
                starFrame++;
                if (introContainer && !introContainer.classList.contains('hidden')) {
                    animId = requestAnimationFrame(drawStars);
                }
            }
            drawStars();

            var exploreBtn = document.getElementById('exploreBtn');
            exploreBtn.addEventListener('click', function() {
                // 点击后停止循环动画，执行俯冲
                exploreBtn.style.animation = 'none';

                introContainer.style.transition = 'transform 1.2s cubic-bezier(0.3, 0.0, 0.2, 1.0), opacity 0.8s ease';
                introContainer.style.transform = 'scale(1.8)';
                introContainer.style.opacity = '0';

                setTimeout(function() {
                    introContainer.classList.add('hidden');
                    if (animId) cancelAnimationFrame(animId);
                    document.getElementById('map-container').style.display = 'block';
                    document.getElementById('guideBox').style.display = 'block';
                    document.getElementById('langSwitch').style.display = 'flex';
                    document.getElementById('customZoom').style.display = 'flex';
                    document.getElementById('filterPanel').style.display = 'block';
                    document.getElementById('hotProjects').style.display = 'block';
                    document.getElementById('map-layer-toggle').style.display = 'flex';
                    setTimeout(function() {
                        initMap();
                    }, 300);
                }, 1400);
            });
        })();

        function switchLayer(layerName) {
            if (!map) return;
            if (tileLayer) {
                map.removeLayer(tileLayer);
            }
            var layer = tileLayers[layerName];
            if (layer) {
                tileLayer = layer;
                map.addLayer(layer);
                currentLayer = layerName;
            }
            // 更新按钮状态
            var btns = document.querySelectorAll('#map-layer-toggle button');
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.remove('active');
                if (btns[i].getAttribute('data-layer') === layerName) {
                    btns[i].classList.add('active');
                }
            }
        }

        function initMap() {
            var container = document.getElementById('map');
            if (!container) return;

            // 创建地图
            map = L.map('map', {
                center: [20, 20],
                zoom: 2.2,
                zoomControl: false,
                fadeAnimation: true,
                zoomAnimation: true,
                inertia: true,
                touchZoom: true,
                scrollWheelZoom: true,
                doubleClickZoom: true
            });

            // ---- 多个底图 ----
            // 1. OpenStreetMap (标准)
            tileLayers['osm'] = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
                subdomains: ['a', 'b', 'c'],
                maxZoom: 19,
                minZoom: 1,
                noWrap: false
            });

            // 2. 卫星图 (Esri)
            tileLayers['satellite'] = L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
                    maxZoom: 19,
                    minZoom: 1
                });

            // 3. 暗色地图
            tileLayers['dark'] = L.tileLayer(
                'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; CartoDB',
                    subdomains: 'abcd',
                    maxZoom: 19,
                    minZoom: 1
                });

            // 默认使用OSM
            tileLayer = tileLayers['osm'];

                for (var r = 0; r < data.length; r++) {

                document.getElementById('map-loading').style.display = 'none';
            });

            // 如果10秒后仍未加载完成，也隐藏loading
            setTimeout(function() {
                document.getElementById('map-loading').style.display = 'none';
            }, 10000);

            updateLanguage('zh');
        }

        // ================================================================
        // 6. 辅助函数
        // ================================================================
        function findRaw(country, title) {
            for (var i = 0; i < rawProjects.length; i++) {
                var p = rawProjects[i];
                if (p.country === country && p.title === title) return p;
            }
            return null;
        }

        function getUniqueCountries(projects) {
            var result = [];
            var seen = {};
            for (var i = 0; i < projects.length; i++) {
                var c = projects[i].country;
                if (!seen[c]) { seen[c] = true;
                    result.push(c); }
            }
            return result;
        }

        function parseRange(val) {
            if (!val) return null;
            val = val.replace(/\s/g, '');
            var parts = val.split('-');
            if (parts.length === 2) {
                var min = parseFloat(parts[0]);
                var max = parseFloat(parts[1]);
                if (!isNaN(min) && !isNaN(max)) return { min: min, max: max };
            }
            var num = parseFloat(val);
            if (!isNaN(num)) return { min: num, max: num };
            return null;
        }

        function matchRange(value, range) {
            if (!range) return true;
            if (!value) return false;
            var num = parseFloat(value);
            if (isNaN(num)) return false;
            if (range.min === range.max) return num === range.min;
            return num >= range.min && num <= range.max;
        }

        function getFilteredProjects() {
            var continent = document.getElementById('filterContinent').value;
            var country = document.getElementById('filterCountry').value;
            var city = document.getElementById('filterCity').value.trim().toLowerCase();
            var scene = document.getElementById('filterScene').value;
            var func = document.getElementById('filterFunction').value;
            var powerRaw = document.getElementById('filterPower').value.trim();
            var capacityRaw = document.getElementById('filterCapacity').value.trim();
            var installDate = document.getElementById('filterInstallDate').value.trim().toLowerCase();

            var powerRange = parseRange(powerRaw);
            var capacityRange = parseRange(capacityRaw);

            var result = [];
            for (var i = 0; i < currentProjects.length; i++) {
                var p = currentProjects[i];
                var raw = findRaw(p._rawCountry, p.title);
                if (!raw) continue;
                var cont = countryContinent[raw.country] || '';
                if (continent !== 'all' && cont !== continent) continue;
                if (country !== 'all' && raw.country !== country) continue;
                if (city && raw.city.toLowerCase().indexOf(city) === -1) continue;
                if (scene !== 'all' && raw.scene !== scene) continue;
                if (func !== 'all' && raw.func !== func) continue;
                if (powerRange && !matchRange(raw.power, powerRange)) continue;
                if (capacityRange && !matchRange(raw.capacity, capacityRange)) continue;
                if (installDate && raw.install.toLowerCase().indexOf(installDate) === -1) continue;
                result.push(p);
            }
            return result;
        }

        function buildVideoLinks(p) {
            var raw = findRaw(p._rawCountry, p.title);
            var html = '<div class="video-links">';
            if (raw && raw.youtube && raw.youtube !== '暂未公开' && raw.youtube !== '未公布' && raw.youtube !==
                '可以公开' && raw.youtube !== '') {
                html += '<a href="' + raw.youtube + '" target="_blank" rel="noopener noreferrer">▶ YouTube</a>';
            } else {
                html += '<span class="no-link">▶ YouTube ' + (currentLang === 'zh' ? '未公开' : 'N/A') + '</span>';
            }
            if (raw && raw.facebook && raw.facebook !== '暂未公开' && raw.facebook !== '未公布' && raw.facebook !==
                '可以公开' && raw.facebook !== '') {
                html += '<a href="' + raw.facebook + '" target="_blank" rel="noopener noreferrer">▶ Facebook</a>';
            } else {
                html += '<span class="no-link">▶ Facebook ' + (currentLang === 'zh' ? '未公开' : 'N/A') + '</span>';
            }
            html += '</div>';
            return html;
        }

        function buildInfoContent(country, projects) {
            var t = uiTexts[currentLang];
            var listHtml = '<div class="project-list">';
            for (var i = 0; i < projects.length; i++) {
                var p = projects[i];
                listHtml +=
                    '<div class="project-item">' +
                    '<div class="title"><span>' + p.title + '</span><span class="badge">#' + (i + 1) + '</span></div>' +
                    '<div class="desc">' +
                    '<span>' + t.fieldScene + ': ' + (p.scene || '—') + '</span>' +
                    '<span>' + t.fieldFunc + ': ' + (p.func || '—') + '</span>' +
                    '<span>' + t.fieldPower + ': ' + (p.power || '') + '</span>' +
                    '<span>' + t.fieldCapacity + ': ' + (p.capacity || '') + '</span>' +
                    '<span>' + t.fieldInstall + ': ' + (p.install || '') + '</span>' +
                    '</div>' +
                    buildVideoLinks(p) +
                    '</div>';
            }
            listHtml += '</div>';
            return '<div class="custom-info-window">' +
                '<div class="country-name">📍 ' + country + '</div>' +
                '<div><span class="project-count-badge">' + projects.length + '</span> ' + t.projectUnit + '</div>' +
                listHtml +
                '<div class="project-detail-more">' + t.clickLinks + '</div>' +
                '</div>';
        }

        function renderMarkers(projects) {
            if (!markersLayer) return;
            markersLayer.clearLayers();

            var groups = {};
            for (var i = 0; i < projects.length; i++) {
                var p = projects[i];
                if (!groups[p.country]) groups[p.country] = [];
                groups[p.country].push(p);
            }

            var t = uiTexts[currentLang];

            for (var country in groups) {
                var projs = groups[country];
                var rawCountry = projs[0]._rawCountry || country;
                var coords = countryCoords[rawCountry];
                if (!coords) continue;
                var count = projs.length;
                var sizeClass = 'small';
                if (count >= 5) sizeClass = 'large';
                else if (count >= 3) sizeClass = '';

                var markerDiv = document.createElement('div');
                markerDiv.className = 'custom-marker ' + sizeClass;
                markerDiv.textContent = count;

                var icon = L.divIcon({
                    html: markerDiv.outerHTML,
                    className: '',
                    iconSize: [44, 44],
                    iconAnchor: [22, 22]
                });

                var marker = L.marker([coords[0], coords[1]], { icon: icon });
                marker._country = country;
                marker._projects = projs;

                marker.on('click', function(e) {
                    var countryName = this._country;
                    var projList = this._projects;
                    var content = buildInfoContent(countryName, projList);
                    if (popup) {
                        map.closePopup(popup);
                    }
                    popup = L.popup({
                        offset: [0, -20],
                        maxWidth: 400,
                        className: 'custom-popup'
                    }).setLatLng(e.latlng)
                        .setContent(content)
                        .openOn(map);
                });

                markersLayer.addLayer(marker);
            }
        }

        function renderHotProjects(projects) {
            var container = document.getElementById('hotScroll');
            if (!container) return;

            var hotList = [];
            for (var i = 0; i < projects.length; i++) {
                var p = projects[i];
                var power = parseFloat(p.power) || 0;
                var cap = parseFloat(p.capacity) || 0;
                if (power >= 500) hotList.push(p);
                else if (cap >= 1000) hotList.push(p);
                else if (p.title.toLowerCase().indexOf('mw') !== -1 || p.title.toLowerCase().indexOf('mwh') !== -1)
                    hotList.push(p);
                else {
                    var rawScene = findRaw(p._rawCountry, p.title)?.scene || '';
                    if (rawScene && ['矿场', '光伏电站', '国家电网', '农场'].indexOf(rawScene) !== -1) hotList.push(p);
                }
            }

            var unique = [];
            var seen = {};
            for (var j = 0; j < hotList.length; j++) {
                var p2 = hotList[j];
                var key = p2.country + p2.title;
                if (!seen[key]) { seen[key] = true;
                    unique.push(p2); }
            }
            unique.sort(function(a, b) {
                var pa = parseFloat(a.power) || 0;
                var pb = parseFloat(b.power) || 0;
                return pb - pa;
            });

            var display = unique.slice(0, 15);
            document.getElementById('hotCount').textContent = display.length + (currentLang === 'zh' ?
                ' 个项目' : ' ' + uiTexts[currentLang].projectUnit);

            container.innerHTML = '';
            if (display.length === 0) {
                container.innerHTML = '<div style="padding:10px 20px;color:#3a5a7a;">' + uiTexts[currentLang].noData +
                    '</div>';
                stopAutoScroll();
                return;
            }

            for (var k = 0; k < display.length; k++) {
                var p3 = display[k];
                var card = document.createElement('div');
                card.className = 'hot-card';
                var raw = findRaw(p3._rawCountry, p3.title);
                var ytLink = '',
                    fbLink = '';
                if (raw && raw.youtube && raw.youtube !== '暂未公开' && raw.youtube !== '未公布' && raw.youtube !==
                    '可以公开' && raw.youtube !== '') {
                    ytLink = '<a href="' + raw.youtube + '" target="_blank" rel="noopener noreferrer">YouTube</a>';
                } else {
                    ytLink = '<span class="no-link">YouTube ' + (currentLang === 'zh' ? '未公开' : 'N/A') + '</span>';
                }
                if (raw && raw.facebook && raw.facebook !== '暂未公开' && raw.facebook !== '未公布' && raw.facebook !==
                    '可以公开' && raw.facebook !== '') {
                    fbLink = '<a href="' + raw.facebook + '" target="_blank" rel="noopener noreferrer">Facebook</a>';
                } else {
                    fbLink = '<span class="no-link">Facebook ' + (currentLang === 'zh' ? '未公开' : 'N/A') + '</span>';
                }
                card.innerHTML =
                    '<div class="card-title">' + p3.title + '</div>' +
                    '<div class="card-meta"><span>' + p3.country + '</span><span>' + (p3.scene || '—') + '</span></div>' +
                    '<div class="card-power">⚡ ' + (p3.power ? p3.power + 'kW' : '') + (p3.capacity ? ' · ' + p3
                        .capacity + 'kWh' : '') + '</div>' +
                    '<div class="card-video-links">' + ytLink + ' ' + fbLink + '</div>';

                card.addEventListener('click', function(p) {
                    return function() {
                        var rawCountry = p._rawCountry || p.country;
                        var coords = countryCoords[rawCountry];
                        if (coords) {
                            map.setView([coords[0], coords[1]], 4);
                            var target = null;
                            markersLayer.eachLayer(function(layer) {
                                if (layer._country === p.country) target = layer;
                            });
                            if (target) {
                                target.fire('click', { latlng: [coords[0], coords[1]] });
                            }
                        }
                    };
                }(p3));
                container.appendChild(card);
            }

            scrollDirection = 1;
            container.scrollTo({ left: 0, behavior: 'smooth' });
            setTimeout(function() { startAutoScroll(); }, 300);
        }

        function startAutoScroll() {
            var container = document.getElementById('hotScroll');
            if (!container) return;
            if (autoScrollInterval) { clearInterval(autoScrollInterval);
                autoScrollInterval = null; }
            if (container.scrollWidth <= container.clientWidth) return;
            autoScrollInterval = setInterval(function() {
                if (!container) return;
                if (container.matches && container.matches(':hover')) return;
                var maxScroll = container.scrollWidth - container.clientWidth;
                var currentScroll = container.scrollLeft;
                if (currentScroll >= maxScroll - 1) scrollDirection = -1;
                else if (currentScroll <= 0) scrollDirection = 1;
                var newScroll = currentScroll + scrollDirection * 1.2;
                if (newScroll < 0) newScroll = 0;
                if (newScroll > maxScroll) newScroll = maxScroll;
                container.scrollTo({ left: newScroll, behavior: 'smooth' });
            }, 50);
        }

        function stopAutoScroll() {
            if (autoScrollInterval) { clearInterval(autoScrollInterval);
                autoScrollInterval = null; }
        }

        function resetAll() {
            document.getElementById('filterContinent').value = 'all';
            document.getElementById('filterCountry').value = 'all';
            document.getElementById('filterCity').value = '';
            document.getElementById('filterScene').value = 'all';
            document.getElementById('filterFunction').value = 'all';
            document.getElementById('filterPower').value = '';
            document.getElementById('filterCapacity').value = '';
            document.getElementById('filterInstallDate').value = '';
            var filtered = currentProjects;
            renderMarkers(filtered);
            renderHotProjects(filtered);
            var unique = getUniqueCountries(filtered);
            document.getElementById('countryCount').textContent = unique.length;
            document.getElementById('projectTotalCount').textContent = filtered.length;
        }

        function updateLanguage(lang) {
            currentLang = lang;
            var t = uiTexts[lang];
            currentProjects = getProjectsForLang(lang);

            document.getElementById('guideTitle').textContent = t.guideTitle;
            document.getElementById('guideCountries').textContent = t.guideCountries;
            document.getElementById('guideProjects').textContent = t.guideProjects;
            document.getElementById('guideStat').textContent = t.guideStat;
            document.getElementById('filterTitle').innerHTML = t.filterTitle;
            document.getElementById('resetBtnText').textContent = t.resetBtnText;
            document.getElementById('labelContinent').textContent = t.labelContinent;
            document.getElementById('labelCountry').textContent = t.labelCountry;
            document.getElementById('labelCity').textContent = t.labelCity;
            document.getElementById('labelScene').textContent = t.labelScene;
            document.getElementById('labelFunction').textContent = t.labelFunction;
            document.getElementById('labelPower').textContent = t.labelPower;
            document.getElementById('labelCapacity').textContent = t.labelCapacity;
            document.getElementById('labelInstallDate').textContent = t.labelInstallDate;
            document.getElementById('applyBtnText').textContent = t.applyBtnText;
            document.getElementById('clearBtnText').textContent = t.clearBtnText;
            document.getElementById('exportBtnText').textContent = t.exportBtnText;
            document.getElementById('hotTitle').innerHTML = t.hotTitle;

            var selects = document.querySelectorAll('#filterContinent option, #filterCountry option, #filterScene option, #filterFunction option');
            for (var s = 0; s < selects.length; s++) {
                var opt = selects[s];
                var val = opt.getAttribute('data-' + lang);
                if (val) opt.textContent = val;
            }

            var inputs = document.querySelectorAll('input[data-zh-placeholder]');
            for (var inp = 0; inp < inputs.length; inp++) {
                var input = inputs[inp];
                var val2 = input.getAttribute('data-' + lang + '-placeholder');
                if (val2) input.placeholder = val2;
            }

            var filtered = getFilteredProjects();
            renderMarkers(filtered);
            renderHotProjects(filtered);
            var unique = getUniqueCountries(filtered);
            document.getElementById('countryCount').textContent = unique.length;
            document.getElementById('projectTotalCount').textContent = filtered.length;

            var buttons = document.querySelectorAll('.lang-switch button');
            for (var b = 0; b < buttons.length; b++) {
                var btn = buttons[b];
                if (btn.getAttribute('data-lang') === lang) {
                    btn.className = 'active';
                } else {
                    btn.className = '';
                }
            }
        }

        // ================================================================
        // 7. 启动
        // ================================================================
        console.log('Bluesun 全球项目地图已加载 ✅');
        console.log('使用 Leaflet + OpenStreetMap');
        console.log('底图切换: OSM / 卫星 / 暗色');
        console.log('按钮循环缩放动画已启动 ✅');
    </script>
